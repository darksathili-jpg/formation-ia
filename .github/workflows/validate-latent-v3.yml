name: Validate LATENT V3

on:
  push:
    branches:
      - refactor/latent-v3-architecture
      - refactor/latent-v3-tokenizer-slice
      - refactor/latent-v3-p1-migration
      - refactor/latent-v3-p1s2-attention
      - refactor/latent-v3-p1s3-transformer-block
    paths:
      - 'latent_app/**'
      - 'formation_llm/docs/AUDIT_ARCHITECTURE_V3_2026-10-02.md'
      - 'formation_llm/docs/ARCHITECTURE_V3_ECDL_HEXAGONAL.md'
      - 'formation_llm/docs/BENCHMARK_FIDLE_2026-10-02.md'
      - 'formation_llm/docs/MIGRATION_STRANGLER_V3.md'
      - 'formation_llm/docs/P1_MIGRATION_INVENTORY_2026-10-04.md'
      - '.github/workflows/validate-latent-v3.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: latent_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: latent_app/package.json

      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Prepare Electron Chromium sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c '%U:%G %a' node_modules/electron/dist/chrome-sandbox)" = "root:root 4755"

      - name: Syntax-check V3 layers
        run: |
          node --check src/entrypoints/electron/main.mjs
          node --check src/entrypoints/electron/preload.cjs
          node --check src/entrypoints/web/appearance.mjs
          node --check src/entrypoints/web/app.mjs
          node --check src/entrypoints/web/tokenizer-app.mjs
          node --check src/application/module-presenter.mjs
          node --check src/application/load-module-bundle.mjs
          node --check src/adapters/web/fetch-content-repository.mjs
          node --check src/adapters/web/module-renderer.mjs
          node --check src/adapters/web/attention-renderer.mjs
          node --check src/adapters/web/transformer-block-renderer.mjs
          node --check src/adapters/web/local-progress-repository.mjs
          node --check src/adapters/web/local-learning-event-repository.mjs
          node --check src/domain/activities/decision.mjs
          node --check src/domain/activities/tokenizer.mjs
          node --check src/domain/activities/context-budget.mjs
          node --check src/domain/activities/representation.mjs
          node --check src/domain/activities/attention.mjs
          node --check src/domain/activities/transformer-block.mjs
          node --check src/domain/activities/position.mjs
          node --check src/domain/activities/kv-cache.mjs
          node --check tests/e2e-smoke.mjs
          node --check tests/visual-a11y.mjs
          node --check tests/p1s2-e2e.mjs
          node --check tests/p1s2-visual-a11y.mjs
          node --check tests/p1s3-e2e.mjs
          node --check tests/p1s3-visual-a11y.mjs
          node --check tools/validate-architecture.mjs
          node --check tools/validate-p1s2-architecture.mjs
          node --check tools/validate-p1s3-architecture.mjs
          node --check tools/validate-content.mjs

      - name: Validate domain, content and architecture
        run: |
          npm run validate
          node tools/validate-p1s2-architecture.mjs
          node tools/validate-p1s3-architecture.mjs

      - name: Baseline E2E Web Electron Visual Accessibility gate
        run: xvfb-run -a --server-args="-screen 0 1440x1000x24" npm run test:e2e

      - name: P1S2 Attention E2E Web Electron Visual Accessibility gate
        run: xvfb-run -a --server-args="-screen 0 1440x1000x24" ./node_modules/.bin/electron . --latent-e2e-p1s2

      - name: P1S3 Transformer Block E2E Web Electron Visual Accessibility gate
        run: xvfb-run -a --server-args="-screen 0 1440x1000x24" ./node_modules/.bin/electron . --latent-e2e-p1s3

      - name: Publish Visual Accessibility Gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latent-v3-visual-a11y-reports
          path: latent_app/artifacts/visual-a11y/*.json
          if-no-files-found: ignore
          retention-days: 14
