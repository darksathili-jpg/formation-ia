name: Validate Formation LLM

on:
  push:
    branches:
      - main
    paths:
      - "formation_llm/**"
      - ".github/workflows/validate-formation-llm.yml"

  pull_request:
    paths:
      - "formation_llm/**"
      - ".github/workflows/validate-formation-llm.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate knowledge base
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: formation_llm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install validator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Formation LLM
        run: npm run validate
