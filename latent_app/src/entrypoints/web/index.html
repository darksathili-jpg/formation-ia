<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'">
  <title>LATENT Learning V3 · Parcours 0</title>
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip" href="#main">Passer au contenu</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navigation du module">
      <div class="brand">
        <div class="mark" aria-hidden="true">L</div>
        <div><strong>LATENT V3</strong><small>Vertical slice · P0</small></div>
      </div>

      <div class="side-block">
        <p class="side-label">Module rendu depuis p0.json</p>
        <nav id="moduleNav" aria-label="Étapes du parcours"></nav>
      </div>

      <div class="side-footer">
        <div class="status-card"><span>Maîtrise</span><strong id="masteryStatus">À charger…</strong></div>
        <div class="status-card"><span>Traces locales</span><strong id="eventCount">0 événement</strong></div>
        <button class="reset-button" id="resetProgress" type="button">Réinitialiser ce pilote</button>
        <div class="runtime" id="runtimeCard">Runtime : navigateur</div>
      </div>
    </aside>

    <main id="main">
      <div class="system-banner" role="status">
        <span class="system-dot" aria-hidden="true"></span>
        <div><strong>Tranche verticale V3</strong><small>Contenu déclaratif → presenter pur → renderer Web · progression et événements via ports</small></div>
      </div>
      <div id="moduleRoot" aria-live="polite">
        <p class="loading">Chargement du module déclaratif…</p>
      </div>
      <noscript>JavaScript est nécessaire pour exécuter les laboratoires interactifs LATENT V3.</noscript>
    </main>
  </div>
</body>
</html>
